<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <style>
      .line { stroke: #0C1622; stroke-width: 0.85; stroke-opacity: 0.12; fill: none; }
      .line-accent { stroke: #185338; stroke-width: 1; stroke-opacity: 0.16; fill: none; }
      .node-teal { fill: #185338; fill-opacity: 0.20; }
      .node-amber { fill: #B85818; fill-opacity: 0.22; }
      .grid-dot { fill: #0C1622; fill-opacity: 0.08; }
    </style>
  </defs>
  <!-- Background subtle structural network lines -->
  <path class="line" d="M0,30 L30,30 L45,15 L75,15 L90,30 L120,30" />
  <path class="line" d="M30,30 L30,60 L15,75 L0,75" />
  <path class="line-accent" d="M45,15 L45,0 M75,15 L75,45 L105,45 L120,60" />
  <path class="line" d="M30,60 L60,60 L75,75 L75,105 L90,120" />
  <path class="line" d="M15,75 L15,105 L30,120" />
  <path class="line-accent" d="M60,60 L60,90 L45,105 L45,120" />
  <path class="line" d="M75,75 L105,75 L120,90" />
  <path class="line" d="M105,45 L105,105 L120,105" />
  <!-- Terminal Nodes -->
  <circle class="node-teal" cx="30" cy="30" r="2.5" />
  <circle class="node-teal" cx="75" cy="45" r="2.5" />
  <circle class="node-amber" cx="60" cy="60" r="2.5" />
  <circle class="node-amber" cx="15" cy="75" r="2" />
  <circle class="node-teal" cx="75" cy="105" r="2" />
  <circle class="grid-dot" cx="0" cy="0" r="1.5" />
  <circle class="grid-dot" cx="60" cy="0" r="1.5" />
  <circle class="grid-dot" cx="120" cy="0" r="1.5" />
  <circle class="grid-dot" cx="0" cy="60" r="1.5" />
  <circle class="grid-dot" cx="120" cy="60" r="1.5" />
  <circle class="grid-dot" cx="0" cy="120" r="1.5" />
  <circle class="grid-dot" cx="60" cy="120" r="1.5" />
  <circle class="grid-dot" cx="120" cy="120" r="1.5" />
</svg>
